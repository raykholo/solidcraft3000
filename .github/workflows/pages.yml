name: Pages

# Builds SolidCraft 3000 on the latest public SolidCraft release and publishes it to this repository's Pages.
# Daily: when tangency-labs/solidcraft has a newer release than the live site, the SolidCraft 3000 commits (from the
# release/branch merge-base to raykholo/solidcraft's sc3000 tip) are cherry-picked onto that release, built and deployed. If they no longer apply,
# the live site stays as it is, the run fails red, and ONE issue here says so (refreshed, not duplicated, while it lasts).
on:
  push:
    branches: [main]
  # A pull request builds and checks everything (tests, the browser check) but never deploys or opens an issue.
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the live site already has the latest release"
        type: boolean
        default: false
      deploy:
        description: "Deploy the build (disable to inspect the Pages artifact only)"
        type: boolean
        default: true
      branch:
        description: "raykholo/solidcraft branch to apply (try a rebased branch before it becomes sc3000)"
        type: string
        default: sc3000

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

# Inspect-only runs (deploy off) get their own group, so the daily run neither cancels them nor is cancelled by them.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || github.event_name == 'workflow_dispatch' && !inputs.deploy && format('pages-inspect-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SolidCraft releases not to build, space-separated tags, for a release whose web app is broken
  # (as 0.48.0 and 0.48.1 were: a blank page, https://github.com/tangency-labs/solidcraft/issues/21584,
  # fixed in 0.49.0). The newest release not listed here is built instead. Empty: build the newest.
  HELD_RELEASES: ""
  TRUNK_VERSION: v0.21.14

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    timeout-minutes: 180
    steps:
      - name: Find the latest SolidCraft release and the live site's
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=""
          for candidate in $(gh release list -R tangency-labs/solidcraft --exclude-drafts --exclude-pre-releases --limit 30 --json tagName -q '.[].tagName'); do
            case " $HELD_RELEASES " in
              *" $candidate "*) echo "held: $candidate" ;;
              *) tag=$candidate; break ;;
            esac
          done
          [ -n "$tag" ] || { echo "::error::every recent SolidCraft release is held"; exit 1; }
          live=$(curl -fsSL "https://raykholo.github.io/solidcraft3000/sc3000-release.txt" 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest $tag, live ${live:-none}"
          if [ "$live" = "$tag" ] && [ "${{ github.event_name }}" = schedule ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$live" = "$tag" ] && [ "${{ inputs.force }}" != true ] && [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.skip != 'true'
        with:
          repository: tangency-labs/solidcraft
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0
      - name: Apply SolidCraft 3000 to the release
        if: steps.release.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BRANCH: ${{ inputs.branch || 'sc3000' }}
        run: |
          git fetch -q https://github.com/raykholo/solidcraft.git "${BRANCH:-sc3000}"
          branch_tip=$(git rev-parse FETCH_HEAD)
          base=$(git merge-base "$TAG" "$branch_tip")
          git -c user.name=sc3000 -c user.email=sc3000@users.noreply.github.com cherry-pick "$base..$branch_tip" || {
            git cherry-pick --abort || true
            # One issue for the whole outage: refresh the open one if there is one, else open it.
            run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            body="The sc3000 commit range $base..$branch_tip no longer cherry-picks cleanly onto SolidCraft $TAG; the live site stays on its previous release until the sc3000 branch is rebased. Run: $run"
            open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"SolidCraft 3000 does not apply\" in:title" --json number -q '.[0].number')
            if [ "$BRANCH" != sc3000 ] || [ "${{ github.event_name }}" = pull_request ]; then
              echo "trying $BRANCH from ${{ github.event_name }}: no issue"
            elif [ -n "$open" ]; then
              gh issue edit "$open" -R "$GITHUB_REPOSITORY" --title "SolidCraft 3000 does not apply to $TAG" || true
              gh issue comment "$open" -R "$GITHUB_REPOSITORY" --body "Still failing, now on $TAG. $body" || true
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "SolidCraft 3000 does not apply to $TAG" --body "$body" || true
            fi
            echo "::error title=SolidCraft 3000 does not apply to $TAG::rebase raykholo/solidcraft's sc3000 branch onto $TAG"
            exit 1
          }
      - uses: dtolnay/rust-toolchain@1.99.1
        if: steps.release.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.release.outputs.skip != 'true'
      - name: Test SolidCraft 3000 with the feature enabled
        if: steps.release.outputs.skip != 'true'
        run: |
          cargo test --profile ci --locked -p solidcraft-web --features sc3000
          # The jokes that live in the UI crate: usage statistics, Community Support.
          cargo test --profile ci --locked -p solidcraft-ui-egui --features sc3000 --lib sc3000
      - name: Install trunk
        if: steps.release.outputs.skip != 'true'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The release wasm build peaks late (link and wasm-opt); twice the hosted runner was lost there
      # ("lost communication with the server"), the sign of a starved machine. More swap gives it room.
      - name: Give the runner 16 GB of swap
        if: steps.release.outputs.skip != 'true'
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Build the web app with SolidCraft 3000 on
        if: steps.release.outputs.skip != 'true'
        working-directory: apps/solidcraft-web
        run: trunk build --release --features sc3000 --public-url ./
      - name: Add the parody note
        if: steps.release.outputs.skip != 'true'
        run: |
          bash packaging/sc3000-note.sh dist/web/index.html
          printf '%s' "${{ steps.release.outputs.tag }}" > dist/web/sc3000-release.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.release.outputs.skip != 'true'
        with:
          path: site-repo
      - name: SolidCraft 3000's own title and link preview
        if: steps.release.outputs.skip != 'true'
        run: |
          cp site-repo/site/og.png dist/web/og.png
          python3 site-repo/site/preview.py dist/web/index.html
      - uses: actions/setup-node@v4
        if: steps.release.outputs.skip != 'true'
        with:
          node-version: 22
      - name: Community Support opens in the page and nothing leaves it (EN and DE)
        if: steps.release.outputs.skip != 'true'
        working-directory: site-repo/site/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/dist/web" > /dev/null 2>&1 &
          server=$!
          npm run support -- http://127.0.0.1:8765/ "$RUNNER_TEMP/support-evidence"
          kill "$server"
      # The Cloud Account works, nothing leaves the page and the design is untouched (EN and DE). The timed
      # pages (sign-out, reset, recovery) are the app's unit tests; inspect runs also reach them, for review.
      - name: Cloud Account works and nothing leaves the page (EN and DE)
        if: steps.release.outputs.skip != 'true'
        working-directory: site-repo/site/tests
        run: |
          python3 -m http.server 8765 --directory "$GITHUB_WORKSPACE/dist/web" > /dev/null 2>&1 &
          server=$!
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.deploy }}" = false ]; then
            npm run account -- http://127.0.0.1:8765/ "$RUNNER_TEMP/account-evidence"
          else
            npm run account -- http://127.0.0.1:8765/ "$RUNNER_TEMP/account-evidence" --quick
          fi
          kill "$server"
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.skip != 'true'
        with:
          name: account-evidence
          path: ${{ runner.temp }}/account-evidence
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && steps.release.outputs.skip != 'true'
        with:
          name: support-evidence
          path: ${{ runner.temp }}/support-evidence
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
        if: steps.release.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.skip != 'true'
        with:
          path: dist/web

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.deploy)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
